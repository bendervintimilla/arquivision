version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      npm-menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps"
    groups:
      pip-backend-menores:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Guayaquil"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps"
    groups:
      actions:
        patterns: ["*"]
