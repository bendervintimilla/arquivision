# Configuración de gitleaks (O1748). Extiende las reglas por defecto y añade
# reglas propias para los tipos de secreto que se filtraron el 21-oct-2026.
title = "gitleaks O1748"

[extend]
useDefault = true

# URL de Postgres con clave embebida (postgres://usuario:clave@host/db).
[[rules]]
id = "postgres-url-con-clave"
description = "URL de conexión Postgres con contraseña embebida"
regex = '''(?i)\bpostgres(?:ql)?://[^:/@\s'"`<>]+:([^@\s'"`<>]{6,})@[^\s'"`<>]+'''
secretGroup = 1
keywords = ["postgres://", "postgresql://"]

  # Marcadores de posición y entornos locales evidentes (no son secretos).
  [[rules.allowlists]]
  description = "placeholders y bases locales"
  regexTarget = "match"
  regexes = [
    '''://[^:/@]+:[\$\{\[<*%]''',
    '''(?i)@(localhost|127\.0\.0\.1|0\.0\.0\.0|db|postgres|host|host\.docker\.internal)[:/]''',
    '''(?i)://[^:/@]+:[^@]*(password|passwd|pass|clave|contrase|changeme|cambia|secret|xxx)[^@]*@''',
  ]

# JWT de Supabase con role service_role (el payload contiene "role":"service_role"
# en cualquiera de las tres alineaciones base64).
[[rules]]
id = "supabase-service-role-jwt"
description = "JWT de Supabase con role service_role"
regex = '''\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]*(?:InJvbGUiOiJzZXJ2aWNlX3JvbGUi|Jyb2xlIjoic2VydmljZV9yb2xl|icm9sZSI6InNlcnZpY2Vfcm9s)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{16,}'''
keywords = ["eyj"]

# Clave secreta de Supabase en formato nuevo (sb_secret_...).
[[rules]]
id = "supabase-secret-key"
description = "Clave secreta de Supabase (formato sb_secret_)"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]
